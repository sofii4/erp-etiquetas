# ============================================
# Módulo de Etiquetas (ERP) — Oracle + PHP-FPM + Nginx
#
# Desenvolvimento no Oracle XE 21c. Para validar no 19c (passo 10 do plano),
# trocar a imagem do serviço `oracle` e DB_SERVICE no .env.
# ============================================

name: projeto-erp

networks:
  erp_network:
    driver: bridge

volumes:
  oracle_data:
    driver: local

services:
  # ------------------------------------------
  # Oracle Database (XE 21c em desenvolvimento)
  # ------------------------------------------
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: erp_oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      # Usadas por docker/oracle/init/01-setup.sh para criar o schema dono da
      # ESMATERI e o usuário (só leitura) da aplicação, no PDB DB_SERVICE.
      DB_SERVICE: ${DB_SERVICE}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SCHEMA: ${DB_SCHEMA}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - oracle_data:/opt/oracle/oradata
      # Executados só no primeiro boot (volume vazio). Para rodar de novo:
      # scripts/reset.sh
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
      - ./docker/oracle/sql:/opt/erp-sql:ro
    networks:
      - erp_network
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ------------------------------------------
  # PHP-FPM (Debian + Oracle Instant Client + OCI8)
  # ------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_php
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    # Configuração pelo ambiente: o .env fica com permissão 600 (só a dona lê)
    # e o PHP-FPM roda como www-data, então o phpdotenv não leria o arquivo —
    # e em produção o normal é receber a configuração assim mesmo.
    # Lista explícita para NÃO repassar ORACLE_PASSWORD (SYSTEM) à aplicação.
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      TZ: ${TZ:-America/Sao_Paulo}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_SERVICE: ${DB_SERVICE}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SCHEMA: ${DB_SCHEMA}
      ETIQUETA_LARGURA_MM: ${ETIQUETA_LARGURA_MM:-100}
      ETIQUETA_ALTURA_MM: ${ETIQUETA_ALTURA_MM:-50}
    volumes:
      - ./:/var/www/html
    networks:
      - erp_network

  # ------------------------------------------
  # Nginx
  # ------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - erp_network
    ports:
      - "${WEB_HOST_PORT:-8190}:80"
    healthcheck:
      # 127.0.0.1 e não localhost: no alpine localhost resolve para ::1 e o
      # nginx só escuta IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
