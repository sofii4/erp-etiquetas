; ============================================
; Módulo de Etiquetas (ERP)
; ============================================

[PHP]
date.timezone = America/Sao_Paulo

memory_limit = 256M
max_execution_time = 120

log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
display_startup_errors = Off

[oci8]
; Reaproveita conexões entre requisições do mesmo worker FPM.
oci8.persistent_timeout = 300
oci8.statement_cache_size = 20
; Busca linhas em lotes (menos idas e voltas ao banco).
oci8.default_prefetch = 100

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; Desenvolvimento: revalida arquivos alterados a cada requisição.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
