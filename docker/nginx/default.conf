# ============================================
# Nginx + PHP-FPM para Slim Framework
# ============================================

upstream php-fpm {
    server php:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 2M;

    # Gerar PDF de etiquetas em lote pode demorar um pouco.
    fastcgi_read_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck do próprio nginx (o /health da aplicação testa PHP + Oracle).
    location = /nginx-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Sem ícone próprio: evita 404 no console (o PDF da etiqueta não declara ícone).
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|css|js|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Slim: toda rota que não for arquivo vai para o front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
